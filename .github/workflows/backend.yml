name: Backend CI

on:
  push:
    branches: [main]
    paths: ['services/api/**', '.github/workflows/backend.yml']
  pull_request:
    branches: [main]
    paths: ['services/api/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv venv && uv pip install -r requirements.txt

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q
