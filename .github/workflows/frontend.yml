name: Frontend CI

on:
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [main]
    paths: ['apps/web/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          API_URL: ${{ secrets.API_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
