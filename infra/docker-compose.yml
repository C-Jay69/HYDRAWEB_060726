services:
  postgres:
    image: postgres:16-alpine
    container_name: hydraweb_postgres
    environment:
      POSTGRES_USER: hydraweb
      POSTGRES_PASSWORD: hydraweb
      POSTGRES_DB: hydraweb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydraweb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hydraweb_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: hydraweb_api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hydraweb:hydraweb@postgres:5432/hydraweb
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8011:8011"
    volumes:
      - ../services/api:/app
      - api_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8011 --reload

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: hydraweb_web
    environment:
      API_URL: http://localhost:8011
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  api_storage:
